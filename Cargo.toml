[package]
name = "honestly-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# 기본 의존성
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
postgres-openssl = "0.5"
openssl = "0.10"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"

# Rate Limiting 옵션 1: Tower Governor (가장 간단)
tower_governor = "0.4"

# Rate Limiting 옵션 2: Redis 기반 (분산 시스템용)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }

# 추가 보안 기능
argon2 = "0.5"  # 비밀번호 해싱용 (선택사항)
jsonwebtoken = "9"  # JWT 토큰용 (선택사항)
